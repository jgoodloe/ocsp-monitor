name: CI

# The single quality gate: tests + security/CVE scan + a working image build.
# Runs on every PR and every push to main, and is reused verbatim by release.yml
# as the release gate (workflow_call) — so a release passes exactly the same
# checks a PR does. Nothing is pushed to a release here; main merges publish an
# :edge image only after every job is green.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1" # weekly: rebuild :edge on the latest patched base image
  workflow_call: {} # invoked by release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jgoodloe/ocsp-monitor

jobs:
  # 1. Tests must pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  # 2. Security review: fail the gate on any pinned dependency with a known
  #    advisory that has a fix available. pip-audit is the authoritative CVE
  #    gate and also covers cryptography's bundled OpenSSL via the pinned
  #    package version. (Base-OS image CVEs are watched daily in
  #    security-scan.yml so a transient upstream base CVE can't block merges.)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (known-vulnerable dependencies)
        # Fails if any pinned dependency has a known advisory. If an advisory has
        # no fix yet and must be accepted temporarily, add: --ignore-vuln <ID>
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  # 3. The image must actually build (base OS + all wheels install cleanly).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (load locally, no push — proves the build works)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ocsp-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Publish the non-release :edge image — ONLY on a real merge to main (or the
  #    weekly base-refresh), and ONLY once tests + security + build are all green.
  #    Releases (:latest / :vX.Y.Z) are cut separately and gated on approval; see
  #    release.yml. :edge is for testing, not for production pulls.
  publish-edge:
    needs: [test, security, build]
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push :edge
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
