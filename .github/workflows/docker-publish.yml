name: Build and publish Docker image

on:
  push:
    branches: [main]
  # Weekly rebuild so the image re-pulls the latest patched python:3.12-slim
  # base layers and reinstalls the current wheels, picking up base-OS security
  # fixes that land within the same tag (which Dependabot does not detect).
  schedule:
    - cron: "23 7 * * 1" # Mondays, off-the-hour
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jgoodloe/ocsp-monitor:latest
