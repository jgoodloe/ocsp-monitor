services:
  ocsp-monitor:
    build: .
    # Or use a prebuilt image instead of build:
    # image: ghcr.io/jgoodloe/ocsp-monitor:latest
    #
    # NOTE: the watchtower service below can only auto-update a container that
    # runs from a registry image, not one built locally with `build:`. For
    # hands-off updates, comment out `build: .` and use the `image:` line above.
    container_name: ocsp-monitor
    restart: unless-stopped
    labels:
      # Opt this container in to watchtower auto-updates (watchtower is started
      # with label-scoping, so only labelled containers are touched).
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      # Bind to loopback only: the app has no authentication, so expose it
      # through your reverse proxy rather than directly. Point the proxy
      # upstream at 127.0.0.1:8080. To serve it directly (no proxy), change
      # this to "8080:8080" AND set TRUSTED_PROXY_HOPS=0 so forwarded headers
      # can't be spoofed.
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      # Set to a subpath (e.g. "/ocsp") if your reverse proxy serves the app
      # under a path rather than its own (sub)domain. Leave empty for root.
      URL_PREFIX: "${URL_PREFIX:-}"
      # Scheduler tick (seconds): how often due responders are evaluated.
      SCHEDULER_INTERVAL: "${SCHEDULER_INTERVAL:-30}"
      # Per-request OCSP HTTP timeout (seconds).
      OCSP_TIMEOUT: "${OCSP_TIMEOUT:-30}"
      # Rows of status history kept per responder.
      HISTORY_LIMIT: "${HISTORY_LIMIT:-200}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Reverse-proxy hops to trust for X-Forwarded-* (0 disables ProxyFix).
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-1}"
      # SSRF egress controls. Block private (RFC1918/ULA) destinations; loopback
      # and link-local (incl. cloud metadata) are always blocked. Internal-PKI
      # users can set OCSP_BLOCK_PRIVATE=false and/or allowlist specific hosts.
      OCSP_BLOCK_PRIVATE: "${OCSP_BLOCK_PRIVATE:-true}"
      OCSP_ALLOWED_HOSTS: "${OCSP_ALLOWED_HOSTS:-}"
      # Abuse limits.
      MAX_PEM_BYTES: "${MAX_PEM_BYTES:-32768}"
      MAX_RESPONDERS: "${MAX_RESPONDERS:-100}"
      RATE_LIMIT_MUTATE: "${RATE_LIMIT_MUTATE:-60}"
      RATE_LIMIT_CHECK: "${RATE_LIMIT_CHECK:-20}"
    volumes:
      # Persistent SQLite database (survives container rebuilds).
      - ocsp_data:/data

  # --- Optional: automatic image updates on the host --------------------------
  # Closes the last mile that GitHub can't: polls the registry and, when a new
  # :latest is published (by the docker-publish workflow), pulls it and restarts
  # ocsp-monitor with the patched image — no manual redeploy.
  #
  # Opt-in: it lives behind the "autoupdate" profile, so a plain `docker compose
  # up -d` does NOT start it. Enable with:
  #     docker compose --profile autoupdate up -d
  #
  # Requirements / caveats:
  #   * ocsp-monitor must run from the registry `image:` (not `build:`) — see above.
  #   * Mounting the Docker socket grants watchtower root-equivalent control of
  #     the host's Docker; only enable it if you accept that trade-off.
  #   * If ghcr.io/jgoodloe/ocsp-monitor is PRIVATE, also mount registry creds,
  #     e.g. add under volumes: - ~/.docker/config.json:/config.json:ro
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: ocsp-watchtower
    restart: unless-stopped
    profiles: ["autoupdate"]
    command: --label-enable --cleanup --rolling-restart --interval 21600  # every 6h
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  ocsp_data:
